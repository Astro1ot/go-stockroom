name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stockroom
          POSTGRES_PASSWORD: stockroom
          POSTGRES_DB: stockroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockroom -d stockroom_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://stockroom:stockroom@localhost:5432/stockroom_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 -cover ./...
      - run: go build ./...
      - run: docker compose config --quiet
