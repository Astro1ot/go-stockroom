name: go-stockroom
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom
      POSTGRES_DB: stockroom
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - stockroom-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockroom -d stockroom"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  api:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      GIN_MODE: release
      DATABASE_URL: postgres://stockroom:stockroom@db:5432/stockroom?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SEED_DEMO: "true"
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/stockroom", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  stockroom-data:
